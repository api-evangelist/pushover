apis:
- aid: pushover:open-client-api
  name: Pushover Open Client API
  description: >-
    Real-time client API for Pushover. Combines a WebSocket channel at wss://client.pushover.net/push
    that streams single-byte control frames (`#` keepalive, `!` new message, `R` reload, `E` permanent
    error, `A` session closed) with REST channels for user login, device registration, message download,
    deletion, and emergency-priority acknowledgement.
  humanURL: https://pushover.net/api/client
